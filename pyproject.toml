[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mr1"
version = "1.0.0"
description = "MR1 Nanopore Reader parametric CAD, firmware, and simulation suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC0-1.0"}
dependencies = [
    "build123d>=0.5.0",
    "wireviz>=0.4.1",
    "graphviz>=0.20",
    "z3-solver>=4.12.0",
    "hypothesis>=6.80.0"
]

[project.optional-dependencies]
simulation = [
    "torch",
    "dl4to"
]
dev = [
    "pytest>=7.0.0"
]
