name: MR1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cad-and-tests:
    name: CAD, Hardware Stack & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Stack Specification
        run: |
          python -c "import src.stack_spec as S; S.assert_valid()"

      - name: Run Full Test Suite (169 Tests & Formal Proofs)
        run: |
          python run_tests.py

      - name: Verify Rebuild Pipeline Sync
        run: |
          python scripts/rebuild_all.py --check

      - name: Verify Manifest Tracking
        run: |
          python scripts/export_manager.py --check

  firmware:
    name: Embedded Firmware Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build MR1 ESP32-S3 Firmware
        run: |
          cd MR1_firmware
          pio run

      - name: Build Pump STM32 Firmware
        run: |
          cd Pump_firmware
          pio run
