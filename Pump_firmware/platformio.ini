[platformio]
default_envs = stm32g431cb

[env:stm32g431cb]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
board_build.mcu = stm32g431cbu6
board_build.f_cpu = 170000000L

build_flags = 
    -DSTM32G431xx
    -std=gnu++17
    -O2
    -Wall
    -DENABLE_HWSERIAL2
    -DPIN_WIRE_SDA=PB9
    -DPIN_WIRE_SCL=PB8

monitor_speed = 115200
upload_protocol = stlink
